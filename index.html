<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum</title>
    <link rel="stylesheet" href="css/style.css?v=4" />
  </head>
  <body>
    <!-- 유튜브 배경 영상 -->
    <div class="bg-video">
      <iframe
        id="bg-iframe"
        title="background music"
        frameborder="0"
        allow="autoplay; encrypted-media"
      ></iframe>
    </div>

    <!-- 날씨 (영상 위 우측 상단 플로팅) -->
    <div id="weather" class="weather hidden">
      <span class="weather__temp">--°</span>
      <div class="weather__meta">
        <span class="weather__city">--</span>
        <span class="weather__desc">--</span>
      </div>
    </div>

    <!-- 왼쪽 대시보드 패널 -->
    <aside class="panel">
      <!-- 상단: 날짜 → 시간 순서 -->
      <header class="panel__head">
        <h2 id="date" class="head__date">----</h2>
        <h1 id="clock" class="head__time">00:00:00</h1>
        <span class="head__rule"></span>
      </header>

      <!-- 인사말 -->
      <h2 id="greeting" class="greeting hidden"></h2>

      <!-- 로그인 폼 -->
      <form id="login-form" class="login-form hidden">
        <input
          id="login-input"
          type="text"
          placeholder="이름을 입력하세요"
          required
          maxlength="15"
        />
        <button>입장 →</button>
      </form>

      <!-- 투두 -->
      <section id="todo-container" class="todo hidden">
        <h3 class="todo__title">TO DO</h3>
        <form id="todo-form" class="todo__form">
          <input
            id="todo-input"
            type="text"
            placeholder="새로운 할 일"
            required
          />
          <button>+</button>
        </form>
        <ul id="todo-list" class="todo__list"></ul>
      </section>

      <!-- 하단 컨트롤 -->
      <footer class="panel__foot">
        <button id="sound-toggle" class="ghost-btn">🔊 소리 켜기</button>
        <button id="logout" class="ghost-btn hidden">로그아웃</button>
      </footer>
    </aside>

    <script src="js/app.js?v=4"></script>
  </body>
</html>
